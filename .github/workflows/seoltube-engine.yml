# seoltube 엔진 자동 빌드
# 매일 NewPipe Extractor 새 버전을 확인하고, 새로 나왔으면 엔진(APK 꼴의 dex 묶음)을 만들어 서명해 올린다.
# 폰의 seoltube 는 seoltube/engine/latest.json 을 보고 새 엔진을 받아 갈아 끼운다.
# 이 파일은 seoltube/ 폴더만 건드린다.
#
# 엔진 번호 = 이 워크플로의 run_number. 폰은 지금 엔진보다 큰 번호만 받으므로, 이 파일 이름을 바꾸거나 워크플로를 지우고
# 다시 만들면 번호가 1 부터 다시 시작해 폰이 새 엔진을 안 받는다(지금 31). 이름을 바꾸지 말 것.
# 공개 저장소의 schedule 은 저장소에 60일 동안 활동(커밋 등)이 없으면 GitHub 가 멈춘다. 멈추면 Actions 화면에서 다시 켠다.
name: seoltube-engine

on:
  schedule:
    - cron: '17 20 * * *'   # 매일 한국 시각 05:17
  workflow_dispatch:
    inputs:
      force:
        description: '같은 NewPipe 버전이어도 다시 만들기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: seoltube-engine

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APK: seoltube/engine/engine/build/outputs/apk/release/engine-release-unsigned.apk
      TAG: seoltube-engine-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: NewPipe 새 버전 확인
        id: v
        run: |
          latest=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)
          cur=""
          if [ -f seoltube/engine/latest.json ]; then cur=$(jq -r '.newpipe' seoltube/engine/latest.json); fi
          echo "NewPipe 최신 $latest, 지금 엔진 ${cur:-없음}"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$cur" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "새 버전 없음, 끝"
          fi

      - if: steps.v.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.v.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 엔진 빌드
        if: steps.v.outputs.skip != 'true'
        run: gradle -p seoltube/engine :engine:assembleRelease -PnewpipeVersion=${{ steps.v.outputs.latest }} --console=plain

      - name: 엔진 확인 (필요한 클래스가 실렸는지)
        if: steps.v.outputs.skip != 'true'
        run: |
          mkdir chk && (cd chk && unzip -q "../$APK" 'classes*.dex')
          DD="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)dexdump"
          for f in chk/classes*.dex; do "$DD" "$f" | grep "Class descriptor"; done > chk/cls.txt
          for c in 'Lcom/seolpc/seoltube/engine/Engine;' 'Lcom/seolpc/seoltube/engine/HttpDownloader;' 'Lorg/schabi/newpipe/extractor/NewPipe;' 'Lorg/mozilla/javascript/Context;'; do
            grep -qF "$c" chk/cls.txt || { echo "없음: $c"; exit 1; }
          done
          echo "클래스 $(wc -l < chk/cls.txt)개, 확인 끝"

      # 같은 엔진 소스와 같은 NewPipe 판을 JVM 에서 돌려 검색, 영상 정보가 되는지 본다(seoltube/engine/smoke).
      # 유튜브가 빌드 서버 주소를 막아 생긴 실패(봇 확인, 429)는 경고만 하고 넘어간다.
      - name: 엔진 시험 (JVM 에서 검색, 영상 정보)
        if: steps.v.outputs.skip != 'true'
        run: gradle -p seoltube/engine/smoke run -PnewpipeVersion=${{ steps.v.outputs.latest }} --console=plain

      - name: 서명하고 올리기
        id: pub
        if: steps.v.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.SEOLTUBE_ENGINE_KEY }}
        run: |
          n=${{ github.run_number }}
          np=${{ steps.v.outputs.latest }}
          api=$(grep -oP 'public static final int API = \K[0-9]+' seoltube/engine/engine/src/main/java/com/seolpc/seoltube/engine/Engine.java || true)
          # 릴리스를 만들기 전에 확인(api 는 정수 하나여야 한다)
          if ! [[ "$api" =~ ^[0-9]+$ ]]; then echo "API 를 읽지 못했습니다: '$api'"; exit 1; fi
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then echo "엔진 번호가 이상합니다: '$n'"; exit 1; fi
          out="$TAG.apk"
          cp "$APK" "$out"
          sha=$(sha256sum "$out" | cut -d' ' -f1)
          size=$(stat -c%s "$out")
          # 서명 둘: sig = APK 파일, msig = 엔진 번호, api, sha256, 크기(latest.json 이 바뀌지 않았는지). 같은 열쇠, 같은 명령.
          # msig 가 서명하는 글: "seoltube-engine\n<engine>\n<api>\n<sha256>\n<size>" (끝 줄바꿈 없음)
          printf 'seoltube-engine\n%s\n%s\n%s\n%s' "$n" "$api" "$sha" "$size" > manifest.txt
          key="$RUNNER_TEMP/key.pem"
          trap 'rm -f "$key"' EXIT        # openssl 이 실패해도 열쇠 파일은 지운다
          (umask 077; printf '%s\n' "$KEY" > "$key")
          openssl dgst -sha256 -sign "$key" -out sig.bin "$out"
          openssl dgst -sha256 -sign "$key" -out msig.bin manifest.txt
          rm -f "$key"
          sig=$(base64 -w0 sig.bin)
          msig=$(base64 -w0 msig.bin)
          # 같은 태그가 이미 있으면(앞 실행을 다시 돌림) 그 릴리스는 건드리지 않고 멈춘다. 새로 돌릴 것
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG 가 이미 있습니다. 다시 돌리기 말고 새로 돌려 주세요"
            exit 1
          fi
          touch "$RUNNER_TEMP/release-started"   # 실패하면 아래 단계가 이번 릴리스를 지운다
          gh release create "$TAG" "$out" --title "seoltube 엔진 $n (NewPipe $np)" \
            --notes "seoltube 앱이 받아 쓰는 엔진입니다. NewPipe Extractor $np (GPL-3.0) 를 묶은 것입니다."
          jq -n --argjson engine "$n" --argjson api "$api" --arg newpipe "$np" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$out" \
             --arg sha256 "$sha" --argjson size "$size" --arg sig "$sig" --arg msig "$msig" \
             --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '{engine:$engine, api:$api, newpipe:$newpipe, url:$url, sha256:$sha256, size:$size, sig:$sig, msig:$msig, built:$built}' \
             > seoltube/engine/latest.json
          cat seoltube/engine/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seoltube/engine/latest.json
          git commit -m "seoltube 엔진 $n (NewPipe $np)"
          # 그동안 다른 커밋이 올라왔으면 그 위에 얹어 다시(세 번까지)
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "latest.json 올림"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "latest.json 을 올리지 못했습니다"
          exit 1

      # 릴리스는 만들었는데 latest.json 을 못 올렸으면(실패, 취소) 이번 릴리스와 태그를 지운다(남으면 다시 돌릴 때 같은 태그로 실패).
      # latest.json 이 이미 이번 엔진을 가리키면 폰이 받아 가는 중이므로 둔다. 이번 실행이 릴리스를 만들기 시작하지 않았으면 아무것도 안 지운다.
      - name: 실패하면 이번 릴리스 지우기
        if: (failure() || cancelled()) && steps.v.outputs.skip != 'true'
        run: |
          if [ ! -f "$RUNNER_TEMP/release-started" ]; then echo "이번 실행은 릴리스를 만들지 않았습니다"; exit 0; fi
          git fetch -q origin "${GITHUB_REF_NAME}" || true
          if git show "origin/${GITHUB_REF_NAME}:seoltube/engine/latest.json" 2>/dev/null | grep -qF "/$TAG/"; then
            echo "latest.json 이 $TAG 를 가리킵니다. 두기"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
            echo "지움: $TAG"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
            echo "태그만 지움: $TAG"
          else
            echo "지울 것 없음"
          fi

      - name: 옛 엔진 정리 (최근 5개만 남김)
        if: steps.v.outputs.skip != 'true'
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("seoltube-engine-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
